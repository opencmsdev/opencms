name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck, unit, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Runs the core suites and the connector conformance kit. The D1
      # connector boots real workerd through Miniflare here, not a mock.
      - name: Unit tests
        run: bun run test:unit

      # Playwright ships its own Chromium; the runner has none preinstalled,
      # so this is required before the E2E job. --with-deps pulls the shared
      # libraries headless Chromium needs on a bare ubuntu image.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/admin

      # Builds the admin SPA first, then drives the whole stack (Bun server,
      # SQLite file, built SPA) through the browser.
      - name: End-to-end tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin/playwright-report
          retention-days: 7
