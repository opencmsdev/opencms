name = "opencms-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Auth requires a signing secret (never commit one):
#   wrangler secret put BETTER_AUTH_SECRET
# Optionally set the canonical URL for cookies/origin checks:
# [vars]
# BETTER_AUTH_URL = "https://opencms-api.YOUR_SUBDOMAIN.workers.dev"

# The admin SPA ships as static assets from the same Worker.
# Build it first: bun run --cwd apps/admin build
[assets]
directory = "../admin/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "opencms"
# Fill in after `wrangler d1 create opencms` (see docs/DEPLOY_CLOUDFLARE.md)
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"
